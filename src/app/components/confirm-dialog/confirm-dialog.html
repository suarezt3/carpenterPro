@if (isOpen(); as open) {
  @if (options(); as opt) {
    <div 
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xs select-none"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      (keydown.escape)="cancel()">
      
      <!-- Backdrop click handler -->
      <button 
        type="button"
        class="fixed inset-0 w-full h-full bg-transparent cursor-default border-0 outline-hidden -z-10"
        (click)="cancel()"
        tabindex="-1"
        aria-label="Cerrar cuadro de diálogo"></button>
      
      <div 
        [class]="themeService.isClassic() ? 'bg-white border-slate-200 text-slate-900 shadow-2xl' : 'bg-slate-900 border-slate-700 text-slate-100 shadow-2xl'"
        class="border rounded-2xl w-full max-w-md p-6 flex flex-col gap-4 relative animate-in zoom-in-95 duration-150">
        
        <!-- Header with Severity Icon -->
        <div class="flex items-start gap-3.5">
          @if (opt.severity === 'danger') {
            <div class="w-11 h-11 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 flex items-center justify-center shrink-0 shadow-xs">
              <span class="material-icons text-2xl">delete_forever</span>
            </div>
          } @else if (opt.severity === 'info') {
            <div class="w-11 h-11 rounded-xl bg-blue-50 border border-blue-200 text-blue-600 flex items-center justify-center shrink-0 shadow-xs">
              <span class="material-icons text-2xl">info</span>
            </div>
          } @else {
            <div class="w-11 h-11 rounded-xl bg-amber-50 border border-amber-200 text-amber-600 flex items-center justify-center shrink-0 shadow-xs">
              <span class="material-icons text-2xl">warning_amber</span>
            </div>
          }

          <div class="space-y-1 min-w-0 flex-1">
            <h3 class="text-base font-bold tracking-tight leading-snug" [class]="themeService.isClassic() ? 'text-slate-900' : 'text-white'">
              {{ opt.title }}
            </h3>
            <p class="text-xs leading-relaxed whitespace-pre-line" [class]="themeService.isClassic() ? 'text-slate-600' : 'text-slate-300'">
              {{ opt.message }}
            </p>
          </div>
        </div>

        <!-- Security / Caution Footer Banner -->
        <div 
          [class]="themeService.isClassic() ? 'bg-slate-50 border-slate-200 text-slate-500' : 'bg-slate-950/80 border-slate-800 text-slate-400'"
          class="px-3 py-2 rounded-lg border text-[11px] flex items-center justify-between">
          <span class="flex items-center gap-1.5">
            <span class="material-icons text-xs text-slate-400">lock_reset</span>
            <span>Confirmación de acción</span>
          </span>
          <div class="flex items-center gap-1.5 font-mono text-[10px]">
            <kbd class="px-1 py-0.2 bg-slate-200 border border-slate-300 rounded text-slate-700" [class]="themeService.isClassic() ? 'bg-slate-200 border-slate-300 text-slate-700' : 'bg-slate-800 border-slate-700 text-slate-300'">Esc</kbd> cancelar
            <kbd class="px-1 py-0.2 bg-slate-200 border border-slate-300 rounded text-slate-700" [class]="themeService.isClassic() ? 'bg-slate-200 border-slate-300 text-slate-700' : 'bg-slate-800 border-slate-700 text-slate-300'">Enter</kbd> aceptar
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center justify-end gap-2.5 pt-1">
          <button 
            type="button"
            (click)="cancel()"
            [class]="themeService.isClassic() ? 'bg-white hover:bg-slate-100 text-slate-700 border-slate-300' : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700'"
            class="px-3.5 py-2 text-xs font-semibold rounded-xl border transition">
            {{ opt.cancelText || 'Cancelar' }}
          </button>

          <button 
            type="button"
            (click)="confirm()"
            [class]="opt.severity === 'danger' 
              ? 'bg-rose-600 hover:bg-rose-700 text-white shadow-xs' 
              : opt.severity === 'info' 
              ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-xs' 
              : 'bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold shadow-xs'"
            class="px-4 py-2 text-xs font-bold rounded-xl transition flex items-center gap-1.5">
            @if (opt.severity === 'danger') {
              <span class="material-icons text-sm">delete</span>
            } @else {
              <span class="material-icons text-sm">check</span>
            }
            <span>{{ opt.confirmText || 'Confirmar' }}</span>
          </button>
        </div>

      </div>
    </div>
  }
}
