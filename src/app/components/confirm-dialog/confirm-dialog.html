@if (isOpen(); as open) {
  @if (options(); as opt) {
    <div 
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs select-none"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      (keydown.escape)="cancel()">
      
      <!-- Backdrop click handler -->
      <button 
        type="button"
        class="fixed inset-0 w-full h-full bg-transparent cursor-default border-0 outline-hidden -z-10"
        (click)="cancel()"
        tabindex="-1"
        aria-label="Cerrar cuadro de diálogo"></button>
      
      <div 
        class="bg-zinc-900 border border-zinc-700/90 rounded-2xl w-full max-w-md shadow-[0_20px_60px_rgba(0,0,0,0.7)] p-6 text-zinc-100 flex flex-col gap-4 relative animate-in zoom-in-95 duration-150">
        
        <!-- Header with Severity Icon -->
        <div class="flex items-start gap-3.5">
          @if (opt.severity === 'danger') {
            <div class="w-11 h-11 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-400 flex items-center justify-center shrink-0 shadow-sm">
              <span class="material-icons text-2xl">delete_forever</span>
            </div>
          } @else if (opt.severity === 'info') {
            <div class="w-11 h-11 rounded-xl bg-blue-500/15 border border-blue-500/40 text-blue-400 flex items-center justify-center shrink-0 shadow-sm">
              <span class="material-icons text-2xl">info</span>
            </div>
          } @else {
            <div class="w-11 h-11 rounded-xl bg-amber-500/15 border border-amber-500/40 text-amber-400 flex items-center justify-center shrink-0 shadow-sm">
              <span class="material-icons text-2xl">warning_amber</span>
            </div>
          }

          <div class="space-y-1 min-w-0 flex-1">
            <h3 class="text-base font-bold text-white tracking-tight leading-snug">
              {{ opt.title }}
            </h3>
            <p class="text-xs text-zinc-300 leading-relaxed whitespace-pre-line">
              {{ opt.message }}
            </p>
          </div>
        </div>

        <!-- Security / Caution Footer Banner -->
        <div class="px-3 py-2 rounded-lg bg-zinc-950/70 border border-zinc-800 text-[11px] text-zinc-400 flex items-center justify-between">
          <span class="flex items-center gap-1.5">
            <span class="material-icons text-xs text-zinc-500">lock_reset</span>
            <span>Acción de confirmación segura</span>
          </span>
          <div class="flex items-center gap-1.5 font-mono text-[10px] text-zinc-500">
            <kbd class="px-1 py-0.2 bg-zinc-800 border border-zinc-700 rounded text-zinc-300">Esc</kbd> cancelar
            <kbd class="px-1 py-0.2 bg-zinc-800 border border-zinc-700 rounded text-zinc-300">Enter</kbd> aceptar
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center justify-end gap-2.5 pt-1">
          <button 
            type="button"
            (click)="cancel()"
            class="px-4 py-2 text-xs font-semibold rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white border border-zinc-700 transition">
            {{ opt.cancelText || 'Cancelar' }}
          </button>

          <button 
            type="button"
            (click)="confirm()"
            [class]="opt.severity === 'danger' 
              ? 'bg-rose-600 hover:bg-rose-500 text-white shadow-rose-950/50' 
              : opt.severity === 'info' 
              ? 'bg-blue-600 hover:bg-blue-500 text-white shadow-blue-950/50' 
              : 'bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold shadow-amber-950/50'"
            class="px-4.5 py-2 text-xs font-bold rounded-xl shadow-lg transition flex items-center gap-1.5">
            @if (opt.severity === 'danger') {
              <span class="material-icons text-sm">delete</span>
            } @else {
              <span class="material-icons text-sm">check</span>
            }
            <span>{{ opt.confirmText || 'Confirmar' }}</span>
          </button>
        </div>

      </div>
    </div>
  }
}
