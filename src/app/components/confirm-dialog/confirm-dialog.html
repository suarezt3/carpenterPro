@if (isOpen()) {
  @if (options(); as opt) {
    <div
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xs select-none"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      (keydown.escape)="cancel()">

      <!-- Fondo interactivo para cerrar al hacer clic afuera -->
      <button
        type="button"
        class="fixed inset-0 w-full h-full bg-transparent cursor-default border-0 outline-hidden -z-10"
        (click)="cancel()"
        tabindex="-1"
        aria-label="Cerrar cuadro de diálogo"></button>

      <!-- Tarjeta del Diálogo de Confirmación -->
      <div
        [class]="themeService.isClassic() ? 'bg-white border-zinc-200 text-zinc-900 shadow-2xl' : 'bg-zinc-900 border-zinc-800 text-zinc-100 shadow-2xl'"
        class="border rounded-lg w-full max-w-md p-6 flex flex-col gap-4 relative animate-in zoom-in-95 duration-150">

        <!-- Cabecera con Ícono Vectorial Hugeicons según Severidad -->
        <div class="flex items-start gap-3.5">
          @if (opt.severity === 'danger') {
            <div class="w-10 h-10 rounded-md bg-rose-50 border border-rose-200 text-rose-600 flex items-center justify-center shrink-0 shadow-xs">
              <hugeicons-icon [icon]="icons.delete" [size]="20" [strokeWidth]="1.8"></hugeicons-icon>
            </div>
          } @else if (opt.severity === 'info') {
            <div class="w-10 h-10 rounded-md bg-zinc-100 border border-zinc-200 text-zinc-700 flex items-center justify-center shrink-0 shadow-xs">
              <hugeicons-icon [icon]="icons.info" [size]="20" [strokeWidth]="1.8"></hugeicons-icon>
            </div>
          } @else {
            <div class="w-10 h-10 rounded-md bg-amber-50 border border-amber-200 text-amber-700 flex items-center justify-center shrink-0 shadow-xs">
              <hugeicons-icon [icon]="icons.warning" [size]="20" [strokeWidth]="1.8"></hugeicons-icon>
            </div>
          }

          <div class="space-y-1 min-w-0 flex-1">
            <h3 class="text-base font-bold tracking-tight leading-snug" [class]="themeService.isClassic() ? 'text-zinc-900' : 'text-white'">
              {{ opt.title }}
            </h3>
            <p class="text-xs leading-relaxed whitespace-pre-line" [class]="themeService.isClassic() ? 'text-zinc-600' : 'text-zinc-300'">
              {{ opt.message }}
            </p>
          </div>
        </div>

        <!-- Franja informativa de atajos de teclado -->
        <div
          [class]="themeService.isClassic() ? 'bg-zinc-50 border-zinc-200 text-zinc-500' : 'bg-zinc-950/80 border-zinc-800 text-zinc-400'"
          class="px-3 py-2 rounded-md border text-[11px] flex items-center justify-between">
          <span class="flex items-center gap-1.5">
            <hugeicons-icon [icon]="icons.lock" [size]="14" [strokeWidth]="1.8" class="text-zinc-400"></hugeicons-icon>
            <span>Confirmación de acción</span>
          </span>
          <div class="flex items-center gap-1.5 font-mono tabular-nums text-[10px]">
            <kbd
              class="px-1 py-0.2 border rounded"
              [class]="themeService.isClassic() ? 'bg-zinc-200 border-zinc-300 text-zinc-700' : 'bg-zinc-800 border-zinc-700 text-zinc-300'">Esc</kbd>
            <span>cancelar</span>
            <kbd
              class="px-1 py-0.2 border rounded"
              [class]="themeService.isClassic() ? 'bg-zinc-200 border-zinc-300 text-zinc-700' : 'bg-zinc-800 border-zinc-700 text-zinc-300'">Enter</kbd>
            <span>aceptar</span>
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="flex items-center justify-end gap-2.5 pt-1">
          <button
            type="button"
            (click)="cancel()"
            [class]="themeService.isClassic() ? 'bg-white hover:bg-zinc-100 text-zinc-700 border-zinc-200' : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border-zinc-700'"
            class="px-3.5 py-2 text-xs font-medium rounded-md border transition cursor-pointer">
            {{ opt.cancelText || 'Cancelar' }}
          </button>

          <button
            type="button"
            (click)="confirm()"
            [class]="opt.severity === 'danger'
              ? 'bg-rose-600 hover:bg-rose-700 text-white shadow-xs'
              : 'bg-blue-600 hover:bg-blue-700 text-white shadow-xs'"
            class="px-4 py-2 text-xs font-medium rounded-md transition flex items-center gap-1.5 cursor-pointer">
            @if (opt.severity === 'danger') {
              <hugeicons-icon [icon]="icons.delete" [size]="15" [strokeWidth]="2"></hugeicons-icon>
            } @else {
              <hugeicons-icon [icon]="icons.check" [size]="15" [strokeWidth]="2"></hugeicons-icon>
            }
            <span>{{ opt.confirmText || 'Confirmar' }}</span>
          </button>
        </div>

      </div>
    </div>
  }
}
